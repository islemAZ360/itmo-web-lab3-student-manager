<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- left ear -->
  <polygon points="15,15 45,35 25,55" fill="#FF9800"/>
  <!-- right ear -->
  <polygon points="85,15 55,35 75,55" fill="#FF9800"/>
  <!-- main head -->
  <circle cx="50" cy="55" r="40" fill="#FFB74D"/>
  <!-- eyes -->
  <circle cx="35" cy="50" r="5" fill="#000"/>
  <circle cx="65" cy="50" r="5" fill="#000"/>
  <!-- nose -->
  <polygon points="45,60 55,60 50,65" fill="#F48FB1"/>
  <!-- face -->
  <path d="M 50 65 Q 45 72 40 68 M 50 65 Q 55 72 60 68" stroke="#000" stroke-width="2" fill="transparent"/>
  <!-- left (Whiskers) -->
  <line x1="10" y1="55" x2="25" y2="58" stroke="#000" stroke-width="2"/>
  <line x1="8" y1="65" x2="25" y2="63" stroke="#000" stroke-width="2"/>
  <!-- right(Whiskers) -->
  <line x1="90" y1="55" x2="75" y2="58" stroke="#000" stroke-width="2"/>
  <line x1="92" y1="65" x2="75" y2="63" stroke="#000" stroke-width="2"/>
</svg>