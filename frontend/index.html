<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="icon" type="image/svg+xml" href="assets/cat.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Экран входа -->
    <div id="auth-screen" class="auth-fullscreen">
        <div class="auth-card">
            <h2 id="auth-title">Sign In</h2>
            <div id="auth-error" class="alert-error" style="display: none;"></div>
            <div id="auth-success" class="alert-success" style="display: none;"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="auth-username" required placeholder="Enter username">
                </div>
                
                <div class="form-group" id="email-group" style="display: none;">
                    <label>Email</label>
                    <input type="email" id="auth-email" placeholder="name@itmo.ru">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="auth-password" required minlength="6" placeholder="At least 6 characters">
                </div>

                <div class="form-group" id="role-group" style="display: none;">
                    <label>Role</label>
                    <select id="auth-role">
                        <option value="USER">USER (Read-only)</option>
                        <option value="ADMIN">ADMIN (Full Access)</option>
                    </select>
                </div>

                <div class="auth-actions">
                    <button type="submit" id="auth-submit-btn" class="btn btn-primary">Login</button>
                    <button type="button" id="auth-toggle-btn" class="btn btn-link">Need an account? Register</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Главный экран -->
    <div id="main-app" class="container" style="display: none;">
        <header class="app-header">
            <div>
                <h1>Student Management System</h1>
                <div class="user-badge">
                    Logged in as: <strong id="current-username"></strong> (<span id="current-role"></span>)
                </div>
            </div>
            <button type="button" id="logout-btn" class="btn btn-danger">Logout</button>
        </header>

        <!-- Фильтры -->
        <div class="filter-box">
            <h3>Student Search & Filter</h3>
            <form id="filter-form">
                <div class="filter-inputs">
                    <div class="filter-field">
                        <input type="text" id="filter-name" maxlength="50" placeholder="Full Name (e.g. Islam)">
                        <small class="error-msg" id="err-filter-name"></small>
                    </div>
                    <div class="filter-field">
                        <input type="text" id="filter-group" pattern="^[A-Za-zА-Яа-я]\d{4}$" maxlength="5" placeholder="Group (e.g. P3278)" title="Формат: одна буква и 4 цифры (например: P3278)">
                        <small class="error-msg" id="err-filter-group"></small>
                    </div>
                    <div class="filter-field">
                        <input type="number" id="filter-dormitory" min="1" max="99" placeholder="Dormitory (1-99)" title="Номер общежития от 1 до 99">
                        <small class="error-msg" id="err-filter-dormitory"></small>
                    </div>
                    <div class="filter-field">
                        <input type="number" id="filter-room" min="1" max="9999" placeholder="Room (1-9999)" title="Номер комнаты от 1 до 9999">
                        <small class="error-msg" id="err-filter-room"></small>
                    </div>
                    <div class="filter-field">
                        <input type="text" id="filter-isu" pattern="^\d{6}$" maxlength="6" placeholder="ISU ID (6 digits)" title="Формат: ровно 6 цифр (например: 470449)">
                        <small class="error-msg" id="err-filter-isu"></small>
                    </div>
                </div>
                <div class="filter-buttons">
                    <button type="button" id="btn-search-auto" class="btn btn-primary">Search (Auto)</button>
                    <button type="button" id="btn-search-get" class="btn btn-secondary">Search (GET)</button>
                    <button type="button" id="btn-search-query" class="btn btn-secondary">Search (Query Body)</button>
                    <button type="button" id="btn-reset-filter" class="btn btn-danger">Reset</button>
                </div>
            </form>
        </div>

        <button id="show-add-form-btn" class="btn btn-success" style="margin-bottom: 15px; display: none;">+ Add Student</button>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Group</th>
                        <th>ISU Number</th>
                        <th>Room</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="student-body"></tbody>
            </table>
        </div>

        <!-- Досье студента (Modal) -->
        <div id="student-dossier" class="card" style="display: none;">
            <h3>Student Dossier</h3>
            <p><strong>Full Name:</strong> <span id="dossier-name"></span></p>
            <p><strong>Group:</strong> <span id="dossier-group"></span></p>
            <p><strong>ISU Number:</strong> <span id="dossier-isu"></span></p>
            <p><strong>Dormitory:</strong> <span id="dossier-dorm"></span></p>
            <p><strong>Room Number:</strong> <span id="dossier-room"></span></p>
            <p><strong>Accommodation Period:</strong> <span id="dossier-date"></span></p>
            <p><strong>Foreign Student:</strong> <span id="dossier-foreign"></span></p>
            <p><strong>Notes:</strong> <span id="dossier-notes"></span></p>
            <br>
            <button type="button" id="close-dossier-btn" class="btn btn-secondary" style="margin-top: 15px;">Close</button>
        </div>

        <!-- Форма студента -->
        <div id="student-form-section" class="card" style="display: none;">
            <h3 id="form-title">Add Student</h3>
            <form id="student-form">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" required maxlength="50" pattern="^[A-Za-zА-Яа-яЁё\s\-]+$" title="Только буквы, пробелы и дефисы">
                </div>

                <div class="form-group">
                    <label for="group">Group *</label>
                    <input type="text" id="group" required maxlength="5" pattern="^[A-Za-zА-Яа-я]\d{4}$" title="Формат: одна буква и 4 цифры (например: P3278)">
                </div>

                <div class="form-group">
                    <label for="isuId">ISU ID (6 digits) *</label>
                    <input type="text" id="isuId" required pattern="^\d{6}$" maxlength="6" title="Формат: ровно 6 цифр (например: 470449)">
                </div>

                <div class="form-group">
                    <label for="dormitoryNumber">Dormitory Number (1-99) *</label>
                    <input type="number" id="dormitoryNumber" required min="1" max="99" title="Номер общежития от 1 до 99">
                </div>

                <div class="form-group">
                    <label for="room">Room Number (1-9999) *</label>
                    <input type="number" id="room" required min="1" max="9999" title="Номер комнаты от 1 до 9999">
                </div>

                <div class="form-group">
                    <label for="accommodationPeriod">Accommodation Period *</label>
                    <input type="date" id="accommodationPeriod" required min="2020-01-01" max="2035-12-31">
                </div>

                <div class="form-group checkbox-group">
                    <label for="isInternational">
                        <input type="checkbox" id="isInternational">
                        <span>International Student</span>
                    </label>
                </div>

                <div class="form-group">
                    <label for="notes">Notes (Max 150 characters)</label>
                    <textarea id="notes" rows="3" maxlength="150"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" id="cancel-form-btn" class="btn btn-secondary">Cancel</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
